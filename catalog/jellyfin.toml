schema = 1
id = "jellyfin"
name = "Jellyfin"
description = "Stream your own media with a private server and administrator setup."
category = "Media"
image = "jellyfin/jellyfin:12.1"
port = 8096
container_port = 8096
data_path = "/config"
docs = "https://jellyfin.org/docs/general/installation/container/"
icon = "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/jellyfin.svg"

[environment]
JELLYFIN_CACHE_DIR = "/config/cache"

[[actions]]
id = "check-health"
label = "Check server health"
description = "Check Jellyfin's local HTTP health endpoint."
command = ["curl", "--fail", "--silent", "http://127.0.0.1:8096/health"]
timeout_seconds = 15
