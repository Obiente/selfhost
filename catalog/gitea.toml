schema = 1
id = "gitea"
name = "Gitea"
description = "Host Git repositories, issues, and code reviews."
category = "Development"
image = "docker.gitea.com/gitea:1.27.3"
port = 3000
container_port = 3000
data_path = "/data"
docs = "https://docs.gitea.com/installation/install-with-docker/"
icon = "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/gitea.svg"

[environment]
USER_UID = "1000"
USER_GID = "1000"
GITEA__database__DB_TYPE = "sqlite3"

[database]
engines = ["mysql", "mariadb"]
engine = "postgres"

[database.environment]
GITEA__database__DB_TYPE = "postgres"
GITEA__database__HOST = "${DATABASE_HOST}:${DATABASE_PORT}"
GITEA__database__NAME = "${DATABASE_NAME}"
GITEA__database__USER = "${DATABASE_USER}"
GITEA__database__PASSWD = "${DATABASE_PASSWORD}"
GITEA__database__SSL_MODE = "${DATABASE_SSL_MODE}"

[database.engine_environment.mysql]
GITEA__database__DB_TYPE = "mysql"
GITEA__database__HOST = "${DATABASE_HOST}:${DATABASE_PORT}"
GITEA__database__NAME = "${DATABASE_NAME}"
GITEA__database__USER = "${DATABASE_USER}"
GITEA__database__PASSWD = "${DATABASE_PASSWORD}"
GITEA__database__SSL_MODE = "${DATABASE_SSL_ENABLED}"

[database.engine_environment.mariadb]
GITEA__database__DB_TYPE = "mysql"
GITEA__database__HOST = "${DATABASE_HOST}:${DATABASE_PORT}"
GITEA__database__NAME = "${DATABASE_NAME}"
GITEA__database__USER = "${DATABASE_USER}"
GITEA__database__PASSWD = "${DATABASE_PASSWORD}"
GITEA__database__SSL_MODE = "${DATABASE_SSL_ENABLED}"

[database.engine_ssl_modes]
postgres = ["disable", "require", "verify-full"]
mysql = ["disable", "require", "verify-full"]
mariadb = ["disable", "require", "verify-full"]
