schema = 1
id = "n8n"
name = "n8n"
description = "Create automation workflows and connect services with persistent encrypted credentials."
category = "Automation"
image = "docker.n8n.io/n8nio/n8n:2.40.7"
port = 5678
container_port = 5678
data_path = "/home/node/.n8n"
docs = "https://docs.n8n.io/deploy/host-n8n/install-options/install-using-docker-compose/"
icon = "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/n8n.svg"

[environment]
N8N_SECURE_COOKIE = "false"
N8N_DIAGNOSTICS_ENABLED = "false"
N8N_PERSONALIZATION_ENABLED = "false"
N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS = "true"

[[secrets]]
environment = "N8N_ENCRYPTION_KEY"
bytes = 32

[database]
engine = "postgres"

[database.environment]
DB_TYPE = "postgresdb"
DB_POSTGRESDB_HOST = "${DATABASE_HOST}"
DB_POSTGRESDB_PORT = "${DATABASE_PORT}"
DB_POSTGRESDB_DATABASE = "${DATABASE_NAME}"
DB_POSTGRESDB_USER = "${DATABASE_USER}"
DB_POSTGRESDB_PASSWORD = "${DATABASE_PASSWORD}"
DB_POSTGRESDB_SSL_ENABLED = "${DATABASE_SSL_ENABLED}"
DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED = "${DATABASE_SSL_REJECT_UNAUTHORIZED}"
