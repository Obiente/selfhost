name: Verify direct binary installation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24' }
      - name: Download the published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./packages/selfhost/package.json").version')
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --dir .local/binary-release --pattern 'selfhost-*' --pattern 'BINARY-SHA256SUMS' --pattern 'install.*'
          cd .local/binary-release
          if command -v sha256sum >/dev/null; then sha256sum --check BINARY-SHA256SUMS; else shasum -a 256 --check BINARY-SHA256SUMS; fi
          cmp install.sh ../../scripts/install.sh
          cmp install.ps1 ../../scripts/install.ps1
      - if: runner.os != 'Windows'
        run: sh scripts/test-binary-installer.sh .local/binary-release
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-binary-installer.ps1 -Assets .local/binary-release
