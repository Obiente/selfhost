name: Install Compose validation tools
description: Install the Docker CLI and Compose for configuration checks without starting an engine
runs:
  using: composite
  steps:
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install docker docker-compose
        mkdir -p "$HOME/.docker/cli-plugins"
        ln -sf "$(brew --prefix)/bin/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $cliDirectory = Join-Path $env:RUNNER_TEMP 'selfhost-docker-cli'
        $archive = Join-Path $env:RUNNER_TEMP 'selfhost-docker-cli.zip'
        Invoke-WebRequest 'https://download.docker.com/win/static/stable/x86_64/docker-29.8.0.zip' -OutFile $archive
        Expand-Archive -LiteralPath $archive -DestinationPath $cliDirectory
        (Join-Path $cliDirectory 'docker') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        $pluginDirectory = Join-Path $env:USERPROFILE '.docker/cli-plugins'
        New-Item -ItemType Directory -Force -Path $pluginDirectory | Out-Null
        Invoke-WebRequest 'https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-windows-x86_64.exe' -OutFile (Join-Path $pluginDirectory 'docker-compose.exe')
    - shell: bash
      run: docker compose version
